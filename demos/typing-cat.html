<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>打字小黑猫</title>
<!-- 复刻：小红书「有没有能get到的🐱」（艾_）。眼睛跟着鼠标；摸头会眯眼；你打字时它用爪子敲小键盘，按下的字母键帽弹出去。 -->
<style>
:root{--cat:#141416;--eye:#D7F23A;--pupil:#141416;--line:#3A3B40;--kb:#F4F1EA;--kb-edge:#1B1B1E;--key:#FFFFFF;--accent:#F28C28;
  --sky1:#E8E4DA;--sky2:#B9BCC6;--ink:#2A2B30}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;font:14px/1.4 "Noto Sans SC",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(80% 60% at 30% 20%,#F3EFE6 0%,transparent 60%),linear-gradient(170deg,var(--sky1),var(--sky2));}
.stage{position:fixed;inset:0;display:grid;place-items:center}
svg#cat{width:min(340px,80vw);height:auto;overflow:visible;touch-action:none}
.hint{position:fixed;left:0;right:0;bottom:20px;text-align:center;font-size:13px;color:#55575E}
.hint kbd{font:12px/1 ui-monospace,monospace;background:#fff;border-radius:4px;padding:2px 5px;box-shadow:0 1px 0 #ccc}
.cap{position:fixed;pointer-events:none;width:26px;height:26px;border-radius:6px;background:var(--key);box-shadow:0 2px 0 #C9C3B6,0 4px 10px rgba(0,0,0,.12);
  display:grid;place-items:center;font:700 13px/1 ui-monospace,monospace;color:var(--ink);will-change:transform,opacity}
#tail{transform-origin:212px 236px;animation:wag 3.2s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
.paw{transition:transform .09s cubic-bezier(.3,1.6,.5,1)}
.paw.down{transform:translateY(10px)}
#lids path{transition:transform .18s ease;transform:scaleY(0)}
#smile{opacity:0;transition:opacity .15s}
.happy #lids path{transform:scaleY(1)}
.happy #smile{opacity:1}
.blink #lids path{transform:scaleY(1);transition-duration:.08s}
#pet{transition:transform .25s cubic-bezier(.3,1.5,.5,1);transform-origin:150px 150px}
.happy #pet{transform:rotate(-4deg) translateY(2px)}
@media (prefers-reduced-motion:reduce){#tail{animation:none}.paw,#lids path,#pet{transition:none}}
</style>
</head>
<body class="">
<div class="stage">
<svg id="cat" viewBox="0 0 300 330" aria-label="会跟着你打字的小黑猫">
  <!-- 尾巴 -->
  <path id="tail" d="M212 236 C252 236 262 200 248 186 C240 178 232 184 238 192 C246 204 238 222 212 222" fill="var(--cat)"/>
  <!-- 身体 -->
  <path d="M86 250 C76 200 92 160 150 156 C208 160 224 200 214 250 Z" fill="var(--cat)"/>
  <path d="M120 200 C118 222 120 240 124 250 M180 200 C182 222 180 240 176 250" stroke="var(--line)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- 头 -->
  <g id="pet">
    <path id="head" d="M84 150 C80 110 94 82 104 66 L116 92 C136 86 164 86 184 92 L196 66 C206 82 220 110 216 150 C212 182 184 196 150 196 C116 196 88 182 84 150 Z" fill="var(--cat)"/>
    <path d="M104 74 L112 90 M196 74 L188 90" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/>
    <!-- 眼睛 -->
    <g id="eyes">
      <circle cx="122" cy="134" r="20" fill="var(--eye)"/><circle cx="178" cy="134" r="20" fill="var(--eye)"/>
      <circle class="pupil" cx="122" cy="134" r="9" fill="var(--pupil)"/><circle class="pupil" cx="178" cy="134" r="9" fill="var(--pupil)"/>
      <circle class="glint" cx="126" cy="129" r="3" fill="#fff"/><circle class="glint" cx="182" cy="129" r="3" fill="#fff"/>
    </g>
    <!-- 眯眼（摸头、眨眼时盖下来） -->
    <g id="lids" fill="var(--cat)">
      <path d="M100 112 H144 V157 H100 Z" style="transform-origin:122px 112px"/>
      <path d="M156 112 H200 V157 H156 Z" style="transform-origin:178px 112px"/>
    </g>
    <!-- 被摸时的笑眼 ^ ^ -->
    <g id="smile" fill="none" stroke="var(--eye)" stroke-width="6" stroke-linecap="round">
      <path d="M106 140 Q122 120 138 140"/><path d="M162 140 Q178 120 194 140"/>
    </g>
    <path d="M146 158 L154 158 L150 163 Z" fill="#5A5B60"/>
    <!-- 胡须 -->
    <g stroke="#E9E7E1" stroke-width="1.6" stroke-linecap="round" opacity=".9">
      <path d="M96 160 L66 154 M96 166 L64 168 M204 160 L234 154 M204 166 L236 168"/>
    </g>
  </g>
  <!-- 键盘 -->
  <g id="kb">
    <rect x="54" y="254" width="192" height="56" rx="10" fill="var(--kb-edge)"/>
    <rect x="58" y="258" width="184" height="44" rx="8" fill="var(--kb)"/>
    <g id="keys"></g>
    <rect x="226" y="266" width="9" height="9" rx="2" fill="var(--accent)"/>
  </g>
  <circle cx="34" cy="276" r="10" fill="#FFFFFF" stroke="#D6D2C8" stroke-width="1.5"/>
  <!-- 爪子（在键盘前面） -->
  <g class="paw" id="pawL"><ellipse cx="122" cy="262" rx="15" ry="10" fill="var(--cat)"/><path d="M116 266 v4 M122 267 v4 M128 266 v4" stroke="var(--line)" stroke-width="1.5" stroke-linecap="round"/></g>
  <g class="paw" id="pawR"><ellipse cx="178" cy="262" rx="15" ry="10" fill="var(--cat)"/><path d="M172 266 v4 M178 267 v4 M184 266 v4" stroke="var(--line)" stroke-width="1.5" stroke-linecap="round"/></g>
</svg>
</div>
<div class="hint">移动鼠标，它会看着你 · 把鼠标放在它头上摸一摸 · 直接<kbd>打字</kbd>（手机上点小键盘），它会跟着敲</div>
<script>
const svg=document.getElementById('cat'),body=document.body;
// 键盘：3 行小键帽，第一个键帽是橙色点缀
const ROWS=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'],keys=document.getElementById('keys'),keyPos={};
ROWS.forEach((row,ri)=>[...row].forEach((ch,ci)=>{const w=15,g=2.2,x0=66+ri*7,x=x0+ci*(w+g),y=264+ri*12;keyPos[ch]={x:x+w/2,y,ri};
  const r=document.createElementNS('http://www.w3.org/2000/svg','rect');Object.assign(r,{});r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',w);r.setAttribute('height',9);r.setAttribute('rx',2);
  r.setAttribute('fill',ri===0&&ci===0?'var(--accent)':'var(--key)');r.dataset.k=ch;keys.appendChild(r)}));
// 眼睛跟随：瞳孔朝鼠标方向偏移，限制在眼眶里，带缓动
const pupils=[...document.querySelectorAll('.pupil')],glints=[...document.querySelectorAll('.glint')],C=[[122,134],[178,134]];
let target={x:0,y:0},cur={x:0,y:0};
function toSvg(cx,cy){const p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(svg.getScreenCTM().inverse())}
addEventListener('pointermove',e=>{const p=toSvg(e.clientX,e.clientY);target={x:p.x-150,y:p.y-134}});
function tick(){cur.x+=(target.x-cur.x)*.15;cur.y+=(target.y-cur.y)*.15;
  const d=Math.hypot(cur.x,cur.y)||1,m=Math.min(8,d/12),dx=cur.x/d*m,dy=cur.y/d*m;
  pupils.forEach((p,i)=>{p.setAttribute('cx',C[i][0]+dx);p.setAttribute('cy',C[i][1]+dy)});
  glints.forEach((g,i)=>{g.setAttribute('cx',C[i][0]+4+dx*.8);g.setAttribute('cy',C[i][1]-5+dy*.8)});
  requestAnimationFrame(tick)}
tick();
// 摸头：鼠标停在头上 → 眯眼、歪头
const head=document.getElementById('pet');
head.addEventListener('pointerenter',()=>body.classList.add('happy'));head.addEventListener('pointerleave',()=>body.classList.remove('happy'));
head.style.cursor='grab';
// 随机眨眼
(function blink(){setTimeout(()=>{if(!body.classList.contains('happy')){body.classList.add('blink');setTimeout(()=>body.classList.remove('blink'),120)}blink()},2500+Math.random()*3500)})();
// 打字：按键所在的半边由对应的爪子去敲，键帽弹起并飞出
const pawL=document.getElementById('pawL'),pawR=document.getElementById('pawR');
// 手机没有键盘：直接点小键盘上的键
keys.addEventListener('pointerdown',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)type(k)});
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;type((e.key.length===1?e.key:'').toUpperCase())});
function type(ch){
  const kp=keyPos[ch];const paw=kp?(kp.x<150?pawL:pawR):(Math.random()<.5?pawL:pawR);
  paw.classList.add('down');setTimeout(()=>paw.classList.remove('down'),110);
  if(!kp)return;const rect=keys.querySelector(`[data-k="${ch}"]`);rect.setAttribute('fill','#E7E2D6');setTimeout(()=>rect.setAttribute('fill',ch==='Q'?'var(--accent)':'var(--key)'),140);
  const m=svg.getScreenCTM(),sx=m.a*kp.x+m.e,sy=m.d*kp.y+m.f;const cap=document.createElement('div');cap.className='cap';cap.textContent=ch;document.body.appendChild(cap);
  const vx=(Math.random()-.5)*160,vy=-(140+Math.random()*80),rot=(Math.random()-.5)*120;
  cap.animate([{transform:`translate(${sx-13}px,${sy-13}px) scale(.6) rotate(0)`,opacity:1},
    {transform:`translate(${sx-13+vx*.6}px,${sy-13+vy}px) scale(1) rotate(${rot*.6}deg)`,opacity:1,offset:.55},
    {transform:`translate(${sx-13+vx}px,${sy-13+vy*.4}px) scale(.9) rotate(${rot}deg)`,opacity:0}],{duration:900,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>cap.remove();
}
</script>
</body>
</html>
