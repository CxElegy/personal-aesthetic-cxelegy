<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一层层叠起来的汉堡</title>
<!--
复刻：小红书「把汉堡做成网页动效🍔」（原作 Clico 的 Stackhouse 官网）。第 2 版。
心动点：真实的汉堡被一层层拆开、再叠回去，看得到面包气孔、番茄籽、芝麻这些质感。
- 食材：8 张写实图层，用 AI 在「同一张图」里按同一个 35° 视角、同一个左上主光生成（保证视角和光线一致），本地 rembg 抠图
  （来源与提示词见 demos/assets/burger/SOURCE.md）
- 往下滚 / 点圆点 / 按方向键：每屏一层食材从上方落下，带旋转、落地压缩回弹，阴影由淡变实；标注线跟着画出来
- 换屏时下一屏的背景色从底部升起，标题一行行换掉
- 最后一屏落到盘子上；鼠标放在汉堡上，会拉开成爆炸图
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1A17;--paper:#EFE9DF}
*{box-sizing:border-box}
html{scroll-snap-type:y mandatory}
body{margin:0;font:14px/1.5 Inter,"Noto Sans SC",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
.scroller section{height:100vh;scroll-snap-align:start}
.stage{position:fixed;inset:0;overflow:hidden;background:var(--bg0,#EFE9DF)}
.wipe{position:absolute;inset:0;clip-path:inset(100% 0 0 0);pointer-events:none}
nav{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:22px;padding:18px 4vw;font-size:12px;transition:color .5s}
nav b{font:600 15px/1 Inter,system-ui;letter-spacing:-.01em;margin-right:14px}nav span{opacity:.72}
nav .r{margin-left:auto;display:flex;gap:16px;align-items:center}
nav .order{background:currentColor;border-radius:999px;padding:7px 15px}
nav .order i{font-style:normal;color:var(--btnText,#fff);font-weight:600}
.copy{position:absolute;left:6.5vw;top:50%;transform:translateY(-46%);width:min(38vw,460px);z-index:3}
.eyebrow{font-size:10.5px;letter-spacing:.2em;font-weight:600;text-transform:uppercase;opacity:.85;margin-bottom:14px}
h1{margin:0;font:500 clamp(44px,6.6vw,96px)/.9 "Playfair Display",Georgia,serif;text-transform:uppercase;letter-spacing:-.025em;transform:scaleX(.86);transform-origin:left}
.copy p{max-width:280px;margin:20px 0 24px;opacity:.72;font-size:12.5px}
.btn{display:inline-flex;gap:8px;align-items:center;border-radius:999px;padding:9px 18px;font-weight:600;font-size:12px;background:var(--btnBg,#1B1A17);color:var(--btnText,#fff);text-decoration:none;transition:background .5s,color .5s}
.line{display:block;overflow:hidden;padding-bottom:.04em}
.line>span{display:block;transition:transform .7s cubic-bezier(.2,.75,.15,1) var(--d,0s),opacity .5s var(--d,0s)}
.line.out>span{transform:translateY(-110%);opacity:0}
.line.pre>span{transform:translateY(110%);opacity:0;transition:none}
.dots{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:8px;z-index:4}
.dots button{all:unset;cursor:pointer;width:6px;height:6px;border-radius:3px;background:currentColor;opacity:.25;transition:opacity .3s,width .3s}
.dots button.on{opacity:.9;width:18px}
.arrow{position:absolute;top:50%;z-index:4;width:30px;height:30px;border-radius:50%;border:0;background:var(--btnBg,#1B1A17);color:var(--btnText,#fff);cursor:pointer;font-size:13px;display:grid;place-items:center;transition:background .5s,color .5s,opacity .3s}
.arrow.l{left:2vw}.arrow.r{right:2vw}
.num{position:absolute;right:5vw;top:13vh;font:500 38px/1 "Playfair Display",serif;text-transform:uppercase;z-index:3;text-align:right}
.num small{display:block;font:500 9px/1 Inter;letter-spacing:.3em;margin-top:8px;opacity:.7}
/* 汉堡舞台 */
#burger{position:absolute;left:62%;top:50%;width:min(31vw,440px);aspect-ratio:1;transform:translate(-50%,-50%);z-index:2}
#burger .it{position:absolute;left:50%;top:0;will-change:transform;pointer-events:none;user-select:none}
#burger .sh{position:absolute;left:50%;border-radius:50%;background:radial-gradient(closest-side,rgba(20,12,4,.42),rgba(20,12,4,0));pointer-events:none}
/* 标注线 */
#notes{position:absolute;inset:0;z-index:3;pointer-events:none}
.note{position:absolute;font-size:10px;line-height:1.35;white-space:nowrap;opacity:0;transition:opacity .4s}
.note.on{opacity:1}
.note b{display:block;font:600 10.5px/1.3 Inter,system-ui;letter-spacing:.06em;text-transform:uppercase}
.note span{opacity:.68}
svg#lines{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}
svg#lines path{fill:none;stroke:currentColor;stroke-width:1;opacity:.55}
svg#lines circle{fill:currentColor}
.frame{position:absolute;border:1px solid currentColor;opacity:.22;z-index:1;pointer-events:none;transition:opacity .5s}
.hint{position:absolute;left:6.5vw;bottom:24px;font-size:11px;opacity:.55;z-index:4}
@media (max-width:760px){.copy{left:6vw;top:12vh;transform:none;width:88vw}h1{font-size:44px}.copy p{display:none}#burger{left:50%;top:66%;width:70vw}.num{top:74px;right:6vw;font-size:22px}#notes,svg#lines,.frame{display:none}.hint{left:6vw;right:6vw;top:178px;bottom:auto}nav span{display:none}.arrow{display:none}.note{font-size:9px}}
@media (prefers-reduced-motion:reduce){.line>span{transition:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="wipe" id="wipe"></div>
  <nav id="nav"><b>Stackhouse</b><span>Order</span><span>Ingredients</span><span>Story ⌄</span><span>Locations</span><span>Careers ⌄</span>
    <div class="r"><span>⌕</span><span>Login</span><span class="order"><i>Order</i></span></div></nav>
  <div class="frame" style="left:52vw;top:20vh;width:30vw;height:56vh"></div>
  <div class="copy">
    <div class="eyebrow line" id="eb"><span></span></div>
    <h1 id="h1"></h1>
    <p class="line" id="p"><span></span></p>
    <a class="btn" href="#" id="btn">Start More →</a>
  </div>
  <div class="num" id="num"><span class="line"><span>One</span></span><small>● ○ ○ ○</small></div>
  <div id="burger"></div>
  <svg id="lines"></svg><div id="notes"></div>
  <button class="arrow l" id="prev" aria-label="上一屏">‹</button><button class="arrow r" id="next" aria-label="下一屏">›</button>
  <div class="dots" id="dots"></div>
  <div class="hint" id="hint">往下滚动 · 每一屏叠一层</div>
</div>
<div class="scroller" id="scroller"></div>
<script>
'use strict';
const A='assets/burger/';
// 每种食材：图片、在汉堡里的宽度（相对底面包）、ry=图片里底面椭圆半高占比、face=顶面中心离顶部的占比、落下的时间点（第几屏）
// 每种食材：图片宽度（相对底面包）、ry = 底面椭圆半高 / 图高（35° 俯视，≈ 0.29×宽/高）、thick = 看得到的厚度 / 图高、第几屏落下
const ING=[
 {id:'plate',  w:1.5, ry:.40,thick:.10,screen:5,name:'Stoneware plate',spec:'Served warm'},
 {id:'bun-bottom',w:1.0,ry:.42,thick:.30,screen:0,name:'Brioche heel',spec:'Butter-toasted · 40 s'},
 {id:'patty',  w:.98,ry:.41,thick:.24,screen:1,name:'Beef patty',spec:'Flame-grilled · 180 g'},
 {id:'cheese', w:.94,ry:.40,thick:.05,screen:1,name:'Aged cheddar',spec:'Melted 30 s',delay:.45},
 {id:'lettuce',w:1.08,ry:.34,thick:.10,screen:2,name:'Butter lettuce',spec:'Picked this morning'},
 {id:'tomato', w:.98,ry:.46,thick:.10,screen:3,name:'Vine tomato',spec:'3 slices · 6 mm'},
 {id:'onion',  w:.86,ry:.40,thick:.08,screen:3,name:'Red onion',spec:'Raw · thin rings',delay:.5},
 {id:'bun-top',w:1.0,ry:.30,thick:0,screen:4,name:'Sesame crown',spec:'Glazed brioche'},
];
const NAT={plate:[472,343],'bun-bottom':[462,314],patty:[447,312],cheese:[488,331],lettuce:[457,379],tomato:[487,289],onion:[417,298],'bun-top':[463,353]};
const SCREENS=[
 {bg:'#EFE9DF',ink:'#1B1A17',btnBg:'#1B1A17',btnText:'#fff',eb:'Premium to start',h:['Built in','layers'],p:'Every Stackhouse burger starts the same way: one bun, toasted until the crumb goes golden.',num:'One'},
 {bg:'#161514',ink:'#F3EEE6',btnBg:'#F3EEE6',btnText:'#161514',eb:'Start with fire',h:['Start','with','fire'],p:'Smashed on cast iron, flipped once, finished with aged cheddar while it still sizzles.',num:'Two'},
 {bg:'#A2B49E',ink:'#18211A',btnBg:'#18211A',btnText:'#fff',eb:'Fresh by nature',h:['Crisp','by','nature'],p:'Butter lettuce from a farm forty minutes away, picked at dawn, never cut with steel.',num:'Three'},
 {bg:'#E2735C',ink:'#2A120C',btnBg:'#2A120C',btnText:'#fff',eb:'Fresh by design',h:['Fresh by','design'],p:'Vine tomatoes sliced to six millimetres, red onion in rings thin enough to read through.',num:'Four'},
 {bg:'#CDA27A',ink:'#24170C',btnBg:'#24170C',btnText:'#fff',eb:'Premium by design',h:['Stacked','to finish'],p:'A glazed sesame crown, pressed down once so every layer meets the next.',num:'Five'},
 {bg:'#EFE9DF',ink:'#1B1A17',btnBg:'#1B1A17',btnText:'#fff',eb:'Premium to start',h:['Built','to bite'],p:'Seven layers, one plate. Hover the burger to take it apart again.',num:'Six'},
];
const N=SCREENS.length;
const $=s=>document.querySelector(s);
const burger=$('#burger'),stage=$('#stage'),wipe=$('#wipe'),notesEl=$('#notes'),lines=$('#lines');
document.getElementById('scroller').innerHTML=SCREENS.map(()=>'<section></section>').join('');
$('#dots').innerHTML=SCREENS.map((_,i)=>`<button aria-label="第 ${i+1} 屏"></button>`).join('');

// 元素
const els={};
for(const g of ING){const sh=document.createElement('div');sh.className='sh';burger.appendChild(sh);
  const im=new Image();im.src=A+g.id+'.webp';im.className='it';im.alt=g.name;im.draggable=false;burger.appendChild(im);
  const n=document.createElement('div');n.className='note';n.innerHTML=`<b>${g.name}</b><span>${g.spec}</span>`;notesEl.appendChild(n);
  els[g.id]={g,im,sh,n,land:null,from:0,spin:0}}

// 叠放位置（单位：底面包宽度 = 1，y 向下）：每层底面椭圆的中心对准上一层顶面中心，顶面中心 = 底面中心 − 自身厚度
function layout(){const out={};let face=null;
  for(const g of ING){if(g.id==='plate')continue;const [nw,nh]=NAT[g.id];const h=g.w*nh/nw;
    const bc=face===null?-h*g.ry:face;const bottom=bc+h*g.ry;const top=bottom-h;out[g.id]={top,h,bottom,bc};face=bc-g.thick*h}
  const [pw,ph]=NAT.plate;const g=ING[0];const h=g.w*ph/pw;const bc=out['bun-bottom'].bc+.03;out.plate={top:bc+h*g.ry-h+h*.12,h,bottom:bc+h*g.ry+h*.12,bc};
  return out}
const POS=layout();

let lock=0,baseYs=null,cur=0,shown=-1,hover=0,hoverT=0,mx=0,my=0;
function setScreen(i,instant){i=Math.max(0,Math.min(N-1,i));if(i===shown)return;const prev=shown;shown=i;const S=SCREENS[i];
  // 背景：下一屏颜色从底部升起
  const fromBg=prev<0?S.bg:SCREENS[prev].bg;
  if(instant||prev<0){stage.style.background=S.bg}else{wipe.style.transition='none';wipe.style.background=S.bg;wipe.style.clipPath='inset(100% 0 0 0)';wipe.offsetWidth;
    wipe.style.transition='clip-path .8s cubic-bezier(.65,0,.25,1)';wipe.style.clipPath='inset(0 0 0 0)';
    clearTimeout(wipe._t);wipe._t=setTimeout(()=>{stage.style.background=S.bg;wipe.style.transition='none';wipe.style.clipPath='inset(100% 0 0 0)'},820)}
  stage.style.color=S.ink;stage.style.setProperty('--btnBg',S.btnBg);stage.style.setProperty('--btnText',S.btnText);
  swapText(S,instant||prev<0);
  [...document.querySelectorAll('.dots button')].forEach((b,k)=>b.classList.toggle('on',k===i));
  // 食材：这一屏之前的都在；本屏的从上方落下；往回滚时，后面的飞回上方
  const now=performance.now();
  for(const k in els){const e=els[k],g=e.g;const should=g.screen<=i;
    if(should&&e.land==null){e.land=instant||prev<0?now-5000:now+(g.delay||0)*1000;e.spin=(Math.random()<.5?-1:1)*(g.id==='lettuce'?22:9+Math.random()*7);e.leave=0}
    if(!should&&e.land!=null){e.leave=now;e.land=null}}
}
function swapText(S,instant){
  const h1=$('#h1');const old=[...h1.children];old.forEach((l,k)=>{l.style.setProperty('--d',k*.05+'s');l.classList.add('out')});
  const put=()=>{h1.innerHTML=S.h.map((t,k)=>`<span class="line pre" style="--d:${.08+k*.07}s"><span>${t}</span></span>`).join('');
    requestAnimationFrame(()=>requestAnimationFrame(()=>h1.querySelectorAll('.line').forEach(l=>l.classList.remove('pre'))))};
  if(instant||!old.length)put();else setTimeout(put,330);
  for(const [id,txt] of [['#eb',S.eb],['#p',S.p],['#num .line',S.num]]){const el=$(id);el.classList.add('out');
    setTimeout(()=>{el.firstElementChild.textContent=txt;el.classList.remove('out');el.classList.add('pre');requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove('pre')))},instant?0:300)}
  $('#num small').textContent=['●','○','○','○','○','○'].map((_,k)=>k===shown?'●':'○').join(' ');
  $('#hint').style.opacity=shown===N-1?'.55':shown===0?'.55':'0';$('#hint').textContent=shown===N-1?(matchMedia('(hover:hover)').matches?'把鼠标放在汉堡上：拉开成爆炸图':'点一下汉堡：拉开成爆炸图'):'往下滚动 · 每一屏叠一层';
}

// 导航：滚动吸附到每一屏 + 圆点 + 箭头 + 方向键
const onScroll=()=>setScreen(Math.round(scrollY/innerHeight));addEventListener('scroll',onScroll,{passive:true});
const go=i=>scrollTo({top:Math.max(0,Math.min(N-1,i))*innerHeight,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
document.querySelectorAll('.dots button').forEach((b,k)=>b.onclick=()=>go(k));
$('#prev').onclick=()=>go(shown-1);$('#next').onclick=()=>go(shown+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(shown+1);if(e.key==='ArrowLeft')go(shown-1)});
addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||shown!==N-1)return;const r=burger.getBoundingClientRect();if(e.clientY>r.top-60&&e.clientY<r.bottom)lock=lock?0:1});
addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;const r=burger.getBoundingClientRect();
  hoverT=(shown===N-1&&e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top-60&&e.clientY<r.bottom)?1:0});

// 动画
const ease=t=>1-Math.pow(1-t,3);
// 落地：带一点压缩回弹
function landCurve(t){if(t<.62){const u=t/.62;return {y:1-u*u,sq:0}}const u=(t-.62)/.38;return {y:0,sq:Math.sin(u*Math.PI)*(1-u)*.9}}
function frame(now){const W=burger.clientWidth;const ht=shown===N-1?Math.max(hoverT,lock):0;hover+=(ht-hover)*.08;
  const stackShift=shown>=5?ease(Math.min(1,(now-(els.plate.land??now))/900)):0;
  // 整个汉堡的中心：叠得越高越往下沉，保持在画面中间
  const topMost=Math.min(...ING.filter(g=>g.id!=='plate'&&els[g.id].land!=null&&now>=els[g.id].land).map(g=>POS[g.id].top),POS['bun-bottom'].top);
  // 叠得越高，整体越往下移，让汉堡中段保持在画面中间
  const bot=shown>=5?POS.plate.bottom:0;const want=W*(.62-(topMost+bot)*.5);baseYs=baseYs==null?want:baseYs+(want-baseYs)*.06;const baseY=baseYs;
  const order=['plate','bun-bottom','patty','cheese','lettuce','tomato','onion','bun-top'];
  lines.innerHTML='';const NOTES=[];
  order.forEach((id,z)=>{const e=els[id],g=e.g,P=POS[id];const w=g.w*W*(id==='plate'?1:1-stackShift*.08),h=P.h*W*(id==='plate'?1:1-stackShift*.08);
    let ty,rot=0,sx=1,sy=1,op=1,shOp=1;
    // 爆炸图：最后一屏悬停时各层按顺序拉开
    const ex=(z-4)*hover*W*.075;
    const restTop=baseY+P.top*W*(id==='plate'?1:1-stackShift*.08)-ex;
    if(e.land==null){ // 不在场：飞回上方
      const t=e.leave?Math.min(1,(now-e.leave)/500):1;ty=lerp(restTop,-W*1.6,ease(t));op=1-t;shOp=0}
    else{const t=Math.max(0,Math.min(1,(now-e.land)/950));
      if(id==='bun-bottom'&&shown===0){ // 第一屏：底面包悬浮，轻轻上下
        const lt=Math.min(1,(now-e.land)/900);ty=restTop-W*.14*(1-ease(lt))+Math.sin(now/700)*W*.008-W*.02;rot=-6+Math.sin(now/900)*1.5;shOp=.55}
      else{const c=landCurve(t);ty=restTop-c.y*(innerHeight*1.1);rot=e.spin*c.y*(id==='lettuce'?Math.cos(now/140):1);sy=1-c.sq*.07;sx=1+c.sq*.04;shOp=Math.min(1,t*1.4)}
      if(t<=0&&id!=='bun-bottom'){op=0}}
    const px=(mx*W*.03)*(z/7),py=(my*W*.02)*(z/7);
    e.im.style.width=w+'px';e.im.style.opacity=op;e.im.style.zIndex=z*2+1;
    e.im.style.transform=`translate(calc(-50% + ${px}px),${ty+py}px) rotate(${rot}deg) scale(${sx},${sy})`;e.im.style.transformOrigin='50% 100%';
    // 阴影：投在下一层上，落下时由淡变实
    const shY=restTop+h-(g.ry*h)*1.1;e.sh.style.cssText=`width:${w*.92}px;height:${g.ry*h*1.5}px;transform:translate(calc(-50% + ${px}px),${shY+py+(id==='plate'?h*.12:0)}px);opacity:${shOp*(id==='plate'?.55:.75)};z-index:${z*2}`;
    // 标注线
    const showNote=e.land!=null&&now-e.land>(id==='bun-bottom'?0:700)&&(id!=='plate'||shown===N-1);const n=e.n;n.classList.toggle('on',showNote);
    if(showNote){const br=burger.getBoundingClientRect();const cx=br.left+W/2+px,cy=br.top+ty+py+h*(1-g.ry);const ax=cx+w*.47,lx=br.left+W*1.22;
      const k=Math.min(1,(now-e.land-(id==='bun-bottom'?0:700))/450);NOTES.push({n,ax,ay:cy,lx,k})}
  });
  // 标注：按高度排开，间距至少 30px，折线连过去
  NOTES.sort((a,b)=>a.ay-b.ay);let lastY=-1e9;for(const q of NOTES){q.ly=Math.max(q.ay,lastY+30);lastY=q.ly}
  let html='';for(const q of NOTES){const mid=q.ax+(q.lx-q.ax)*.55;const e1=ease(q.k);
    const d=`M${q.ax} ${q.ay} H${q.ax+(mid-q.ax)*Math.min(1,e1*2)}`+(e1>.5?` L${mid+(q.lx-mid)*(e1-.5)*2} ${q.ay+(q.ly-q.ay)*(e1-.5)*2}`:'');
    html+=`<circle cx="${q.ax}" cy="${q.ay}" r="2.2"/><path d="${d}"/>`;q.n.style.left=(q.lx+8)+'px';q.n.style.top=(q.ly-13)+'px'}
  lines.innerHTML=html;
  requestAnimationFrame(frame)}
const lerp=(a,b,t)=>a+(b-a)*t;
setScreen(Math.round(scrollY/innerHeight),true);requestAnimationFrame(frame);
</script>
</body>
</html>
