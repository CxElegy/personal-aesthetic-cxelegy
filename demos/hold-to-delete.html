<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>长按删除</title>
<!-- 复刻：小红书「这个“删除”的交互方式对你有没有启发」（逸少UIUX）。长按垃圾桶 → 红色进度环走满 → 这一行收起；中途松手取消；删空后可以一键找回。 -->
<style>
:root{--bg:#F3F2F0;--card:#FFFFFF;--ink:#17181C;--sub:#8A8C93;--line:#ECEBE8;--danger:#E5484D;--link:#2F6FEB;
  --key:#E9EEFF;--key-ink:#4A63D9;--doc:#E6F5EC;--doc-ink:#2E8B57;--mov:#F1E9FF;--mov-ink:#7A4FD6;--hold:900ms}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#FAFAF9,var(--bg));
  font:14px/1.4 Inter,"Noto Sans SC",system-ui,sans-serif;color:var(--ink);padding:16px}
.wrap{width:min(380px,100%)}
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);padding:14px 14px 6px;overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 10px}
.head b{font-size:14px}.head span{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;gap:12px;padding:8px 4px;
  transition:height .32s cubic-bezier(.2,.8,.2,1),opacity .2s,transform .32s cubic-bezier(.2,.8,.2,1),padding .32s;height:56px}
.row.gone{height:0;padding-top:0;padding-bottom:0;opacity:0;transform:translateX(12px)}
.badge{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:10px;font-weight:700;letter-spacing:.04em}
.KEY{background:var(--key);color:var(--key-ink)}.DOC{background:var(--doc);color:var(--doc-ink)}.MOV{background:var(--mov);color:var(--mov-ink)}
.name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--sub);transition:color .2s}
.row.holding .meta{color:var(--danger)}
.bin{position:relative;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:#9A9CA3;cursor:pointer;
  display:grid;place-items:center;transition:background .15s,color .15s,transform .15s;touch-action:none;-webkit-user-select:none;user-select:none}
.bin:hover{background:#F2F2F3;color:var(--ink)}
.row.holding .bin{color:var(--danger);background:#FDECEC;transform:scale(.94)}
.bin svg.ring{position:absolute;inset:0;transform:rotate(-90deg);pointer-events:none}
.ring circle{fill:none;stroke:var(--danger);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
.row.holding .ring circle{transition:stroke-dashoffset var(--hold) linear;stroke-dashoffset:0}
.row:not(.holding) .ring circle{transition:stroke-dashoffset .25s ease-out}
.row.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(1px)}}
.empty{display:none;padding:14px 4px 18px;text-align:center;font-size:13px;color:var(--sub)}
.empty.on{display:block}
.empty button{border:0;background:none;color:var(--link);text-decoration:underline;font:inherit;cursor:pointer;padding:0 2px}
.hint{margin-top:14px;text-align:center;font-size:12px;color:var(--sub)}
@media (prefers-reduced-motion:reduce){.row,.ring circle{transition:none!important}.row.shake{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head"><b>Uploads</b><span id="count"></span></div>
    <div id="list"></div>
    <div class="empty" id="empty">列表已经清空。<button id="back">全部找回</button></div>
  </div>
  <div class="hint">长按垃圾桶删除文件（松手就取消）</div>
</div>
<script>
const FILES=[{t:'KEY',n:'Q3 board deck.key',s:'18.2 MB'},{t:'DOC',n:'Interview notes.docx',s:'214 KB'},{t:'MOV',n:'Launch film raw.mov',s:'1.4 GB'}];
const HOLD=900, list=document.getElementById('list'), countEl=document.getElementById('count'), empty=document.getElementById('empty');
const bin='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>';
const ring='<svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" pathLength="100"/></svg>';
function count(){const n=list.querySelectorAll('.row:not(.gone)').length;countEl.textContent=n+(n===1?' file':' files');empty.classList.toggle('on',n===0)}
function render(){list.innerHTML='';FILES.forEach(f=>{const r=document.createElement('div');r.className='row';
  r.innerHTML=`<div class="badge ${f.t}">${f.t}</div><div style="min-width:0"><div class="name">${f.n}</div><div class="meta">${f.s}</div></div><button class="bin" aria-label="长按删除 ${f.n}">${ring}${bin}</button>`;
  const b=r.querySelector('.bin'),meta=r.querySelector('.meta');let timer=null;
  const start=e=>{e.preventDefault();if(r.classList.contains('gone'))return;r.classList.add('holding');meta.textContent='继续按住即可删除';navigator.vibrate?.(8);
    timer=setTimeout(()=>{timer=null;r.classList.remove('holding');r.classList.add('gone');navigator.vibrate?.([12,30,12]);count();setTimeout(()=>r.remove(),340)},HOLD)};
  const cancel=()=>{if(!timer)return;clearTimeout(timer);timer=null;r.classList.remove('holding');meta.textContent=f.s;r.classList.add('shake');setTimeout(()=>r.classList.remove('shake'),340)};
  b.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,cancel));
  b.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat)start(e)});b.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')cancel()});
  list.appendChild(r)});count()}
document.getElementById('back').onclick=render;render();
</script>
</body>
</html>
